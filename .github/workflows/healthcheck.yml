name: Pipeline Health Check

# The failsafe. Scoring broke on 2026-08-04 and nobody noticed for two weeks,
# because every symptom was passive: a red run nobody opened, a pile of Unscored
# rows nobody counted. This job actively posts to Teams the moment the pipeline
# stops working, and stays silent otherwise.
on:
  schedule:
    # 16:00 UTC daily — an hour after the weekday poll, and every day so a
    # weekend breakage is caught rather than waiting until Monday.
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: competitive_intel/requirements.txt

      - name: Install dependencies
        run: pip install -r competitive_intel/requirements.txt

      - name: Run health check
        working-directory: competitive_intel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CHANGEDETECTION_API_KEY: ${{ secrets.CHANGEDETECTION_API_KEY }}
          CHANGEDETECTION_BASE_URL: ${{ secrets.CHANGEDETECTION_BASE_URL }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_CHANGES_DB_ID: ${{ secrets.NOTION_CHANGES_DB_ID }}
          TEAMS_GENERAL_WEBHOOK: ${{ secrets.TEAMS_GENERAL_WEBHOOK }}
          # Lets the check read the daily poll's run history, so it can spot a
          # schedule that has stopped firing. Provided automatically by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Exit codes carry meaning (see jobs/healthcheck.py):
          #   0 healthy · 2 problems found AND reported to Teams · 1 crashed or
          #   could not deliver the report.
          # Exit 2 must NOT fail the job: somebody has already been told, and a red
          # run here would trigger the crash alert below, which is what made the
          # check post "HEALTH CHECK CRASHED" every day while working perfectly.
          set +e
          python -m jobs.healthcheck
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::Pipeline problems found and reported to Teams. Not failing the job — the report was delivered."
            exit 0
          fi
          exit $code

      # Only reached now when the check genuinely crashed, or could not deliver
      # its report (exit 1). Normal problem detection exits 2 and is handled
      # above, so this card no longer fires while the check is working correctly.
      - name: Alert Teams if the health check itself failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.TEAMS_GENERAL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          hook = os.environ.get("WEBHOOK", "")
          if not hook:
              print("No TEAMS_GENERAL_WEBHOOK set; cannot alert.")
              raise SystemExit(0)
          card = {
              "type": "AdaptiveCard",
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "version": "1.5",
              "body": [
                  {"type": "Container", "style": "attention", "bleed": True, "items": [
                      {"type": "TextBlock", "text": "Competitive Intel: HEALTH CHECK CRASHED",
                       "weight": "Bolder", "size": "Large", "wrap": True},
                      {"type": "TextBlock", "text": "The watchdog crashed, or could not deliver its report. The pipeline is now unmonitored.",
                       "spacing": "None", "isSubtle": True, "wrap": True}]},
                  {"type": "TextBlock", "wrap": True,
                   "text": "This card does NOT mean a check failed — a failed check reports itself and exits 2. It means the check could not run or could not be heard. Open the run log. Until it is fixed, a silent pipeline failure will go unnoticed."},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "Open run log",
                           "url": os.environ.get("RUN_URL", "")}],
          }
          urllib.request.urlopen(urllib.request.Request(
              hook, data=json.dumps(card).encode(),
              headers={"Content-Type": "application/json"}), timeout=20)
          print("Crash alert sent to Teams.")
          PY
