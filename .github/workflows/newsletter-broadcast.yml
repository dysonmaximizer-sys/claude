name: Newsletter (Monthly Broadcast)

on:
  schedule:
    # Fires on the 1st-3rd at 16:00 UTC; the business-day gate step lets only
    # the first business day on/after the 1st proceed (the 1st if it's a
    # weekday, otherwise the following Monday). GitHub cron ignores DST, so
    # 16:00 UTC lands at 09:00 Pacific during PDT (~Mar–Nov) and 08:00 Pacific
    # during PST — biased early (never later than 9am) for a morning newsletter.
    - cron: "0 16 1-3 * *"
  workflow_dispatch:
    inputs:
      target_year:
        description: "Year (e.g. 2026) — leave blank for previous month"
        required: false
      target_month:
        description: "Month 1-12 — leave blank for previous month"
        required: false
      confirm:
        description: 'Type SEND to confirm a MANUAL broadcast (scheduled runs skip this)'
        required: false

jobs:
  broadcast-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Broadcast newsletter to CI Newsletter audience

    steps:
      # Scheduled runs auto-send. Manual runs must type SEND to guard against
      # accidental re-broadcasts.
      - name: Confirmation gate (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "SEND" ]; then
            echo "::error::Manual broadcast requires confirm=SEND. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
      # The cron fires on the 1st-3rd; only the first business day on or after
      # the 1st sends: the 1st itself if it's a weekday, otherwise the following
      # Monday (the 2nd or 3rd). Exactly one run per month passes the gate.
      # Manual workflow_dispatch runs always proceed.
      - name: Business-day gate (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(date -u +%d)
          dow=$(date -u +%u)  # 1=Mon ... 7=Sun
          if [ "$dow" -le 5 ] && { [ "$day" -eq 1 ] || [ "$dow" -eq 1 ]; }; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Not the first business day of the month (day $day, weekday $dow) — skipping."
          fi
      - name: Checkout
        if: steps.gate.outputs.send == 'true'
        uses: actions/checkout@v5
      - name: Set up Python
        if: steps.gate.outputs.send == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: competitive_intel/requirements.txt
      - name: Install dependencies
        if: steps.gate.outputs.send == 'true'
        run: pip install -r competitive_intel/requirements.txt
      - name: Broadcast newsletter
        if: steps.gate.outputs.send == 'true'
        working-directory: competitive_intel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CHANGEDETECTION_API_KEY: ${{ secrets.CHANGEDETECTION_API_KEY }}
          CHANGEDETECTION_BASE_URL: ${{ secrets.CHANGEDETECTION_BASE_URL }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_CHANGES_DB_ID: ${{ secrets.NOTION_CHANGES_DB_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: |
          # No --year/--month → the job defaults to the previous calendar month.
          ARGS="--mode broadcast"
          if [ -n "${{ github.event.inputs.target_year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.target_year }} --month ${{ github.event.inputs.target_month }}"
          fi
          python -m jobs.monthly_newsletter $ARGS

      # Failsafe: a red X in the Actions tab is passive and was missed for two
      # weeks in August 2026. This pushes the failure to where people look.
      - name: Alert Teams if this job failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.TEAMS_GENERAL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_LABEL: "monthly newsletter"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          hook = os.environ.get("WEBHOOK", "")
          if not hook:
              print("No TEAMS_GENERAL_WEBHOOK set; cannot alert.")
              raise SystemExit(0)
          label = os.environ.get("JOB_LABEL", "job")
          card = {
              "type": "AdaptiveCard",
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "version": "1.5",
              "body": [
                  {"type": "Container", "style": "attention", "bleed": True, "items": [
                      {"type": "TextBlock", "text": f"Competitive Intel: {label} FAILED",
                       "weight": "Bolder", "size": "Large", "wrap": True},
                      {"type": "TextBlock", "text": "Competitor changes may be going undetected until this is fixed.",
                       "spacing": "None", "isSubtle": True, "wrap": True}]},
                  {"type": "TextBlock", "wrap": True,
                   "text": "Most likely causes: the Anthropic key cannot pay (run `python3 -m scripts.check_api_key`), changedetection.io is unreachable, or Notion rejected a write. The run log says which."},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "Open run log",
                           "url": os.environ.get("RUN_URL", "")}],
          }
          urllib.request.urlopen(urllib.request.Request(
              hook, data=json.dumps(card).encode(),
              headers={"Content-Type": "application/json"}), timeout=20)
          print("Failure alert sent to Teams.")
          PY
